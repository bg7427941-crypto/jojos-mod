[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
An original Minecraft Stand system inspired by JoJo's Bizarre Adventure.
Star Platinum playtest: Star Finger, precise strike, timed barrage, frontal guard, persistent basic and advanced willpower mastery, earned cooldown bonuses and progress HUD.
Stand leap, precise arrow interception and a Star Platinum model and anime atlas adapted from Roundabout by Hydraheads and contributors, with fourteen original animations, synthesized sound effects and eight manually added listening-preview clips; see THIRD_PARTY_NOTICES.md.
Hierophant Green joins the Part 3 arrow pool with Emerald Splash, nine real emerald projectiles, a rebuilt original model, six animations, layered effects and anime recordings and persistent mastery.
Five more Part 3 Stands join with distinct combat, credited models, original animations, collected recordings and persistent learning. The World and advanced Star Platinum can stop local time.
Owner-specific voice channels route each Stand attack to its recording. Longer rushes and follow-through, stronger combat profiles. Network protocol 12.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="geckolib"
type="required"
versionRange="[${geckolib_version},6.0)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="[${minecraft_version}]"
ordering="NONE"
side="BOTH"

[[mixins]]
config="jojosmod.mixins.json"
