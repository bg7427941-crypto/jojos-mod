[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
An original Minecraft Stand system inspired by JoJo's Bizarre Adventure.
Star Platinum playtest: Star Finger, precise strike, timed barrage, frontal guard, persistent willpower mastery and progress HUD.
Stand leap, precise arrow interception and a Star Platinum model and anime atlas adapted from Roundabout by Hydraheads and contributors, with thirteen original animations and synthesized sound effects; see THIRD_PARTY_NOTICES.md.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="geckolib"
type="required"
versionRange="[${geckolib_version},6.0)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="[${minecraft_version}]"
ordering="NONE"
side="BOTH"
