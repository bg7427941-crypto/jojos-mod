plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id
base.archivesName = mod_id

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroupAndSubgroups 'com.geckolib' }
    }
}

dependencies {
    implementation "com.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
}

sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    gameTestImplementation.extendsFrom implementation
    gameTestRuntimeOnly.extendsFrom runtimeOnly
}

neoForge {
    version = project.neo_version
    addModdingDependenciesTo sourceSets.gameTest

    mods {
        jojosmod {
            sourceSet sourceSets.main
        }
        jojosmod_tests {
            sourceSet sourceSets.gameTest
        }
    }

    runs {
        client {
            client()
            loadedMods = [mods.jojosmod]
            gameDirectory = project.file('run/client')
        }
        server {
            server()
            loadedMods = [mods.jojosmod]
            gameDirectory = project.file('run/server')
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gameTest
            loadedMods = [mods.jojosmod, mods.jojosmod_tests]
            gameDirectory = project.file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'jojosmod_tests'
        }
    }
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def properties = [
        mod_id: mod_id,
        mod_name: mod_name,
        mod_version: mod_version,
        minecraft_version: minecraft_version,
        neo_version: neo_version,
        geckolib_version: geckolib_version
    ]
    inputs.properties properties
    expand properties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/modMetadata')
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar) {
    from('LICENSE')
    from('art/anime_audio/LICENSE-GPL-3.0.txt') { into 'META-INF/jojosmod/audio-licenses' }
    from('art/anime_audio/sources.json') { into 'META-INF/jojosmod'; rename { 'anime-audio-sources.json' } }
    from('art/anime_audio/provenance.json') { into 'META-INF/jojosmod'; rename { 'anime-audio-provenance.json' } }
    from('LICENSE-MDK.txt')
    from('THIRD_PARTY_NOTICES.md')
    from('art/star_platinum/upstream/LICENSE-Roundabout.txt')
    from('art/star_platinum/asset-provenance.json') {
        into 'META-INF/jojosmod'
        rename { 'star-platinum-provenance.json' }
    }
    from('art/sounds/original-provenance.json') {
        into 'META-INF/jojosmod'
        rename { 'sound-original.json' }
    }
    from('art/sounds/collected-preview-provenance.json') {
        into 'META-INF/jojosmod'
        rename { 'sound-collected-preview.json' }
    }
    from('art/hierophant_green/asset-provenance.json') {
        into 'META-INF/jojosmod'
        rename { 'hierophant-green-provenance.json' }
    }
    from('art/part_three/asset-provenance.json') { into 'META-INF/jojosmod'; rename { 'part-three-provenance.json' } }
    from('art/part_three/time-effects-provenance.json') { into 'META-INF/jojosmod'; rename { 'time-effects-provenance.json' } }
    from('art/part_three/sound-provenance.json') { into 'META-INF/jojosmod'; rename { 'sound-part-three.json' } }
    from('art/hierophant_green/sound-provenance.json') {
        into 'META-INF/jojosmod'
        rename { 'sound-hierophant-green.json' }
    }
}

// Compile the integration suite during a normal build; execute it with runGameTestServer.
tasks.named('check') {
    dependsOn tasks.named('gameTestClasses')
}
