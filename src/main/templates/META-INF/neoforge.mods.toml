version="${mod_version}"
displayName="${mod_name}"
description='''
An original Minecraft Stand system inspired by JoJo's Bizarre Adventure.
Star Platinum playtest: original animated model, precise strike, timed barrage, frontal guard and a Stardust awakening route.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
