name: Alpha checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpha-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile, run native tests and verify the public package
        run: ./gradlew --no-daemon build runGameTestServer animeAlphaDist publicAlphaDist
      - name: Prove the release gate rejects invalid artifacts
        run: python3 -m unittest discover -s tools/release -p 'test_*.py'
      - name: Retain the public download
        uses: actions/upload-artifact@v4
        with:
          name: jojosmod-public-alpha
          path: build/distributions/*-public-alpha.zip
          if-no-files-found: error
      - name: Retain the alpha with anime recordings
        uses: actions/upload-artifact@v4
        with:
          name: jojosmod-anime-alpha
          path: build/distributions/*-anime-alpha.zip
          if-no-files-found: error
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-test-evidence
          path: |
            run/gametest/logs/*.log
            build/publicAlphaVerification/*
            build/animeAlphaVerification/*
