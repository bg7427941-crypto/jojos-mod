plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id
base.archivesName = mod_id

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroupAndSubgroups 'com.geckolib' }
    }
}

dependencies {
    implementation "com.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
}

sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    gameTestImplementation.extendsFrom implementation
    gameTestRuntimeOnly.extendsFrom runtimeOnly
}

neoForge {
    version = project.neo_version
    addModdingDependenciesTo sourceSets.gameTest

    mods {
        jojosmod {
            sourceSet sourceSets.main
        }
        jojosmod_tests {
            sourceSet sourceSets.gameTest
        }
    }

    runs {
        client {
            client()
            loadedMods = [mods.jojosmod]
            gameDirectory = project.file('run/client')
        }
        server {
            server()
            loadedMods = [mods.jojosmod]
            gameDirectory = project.file('run/server')
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gameTest
            loadedMods = [mods.jojosmod, mods.jojosmod_tests]
            gameDirectory = project.file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'jojosmod_tests'
        }
    }
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def properties = [
        mod_id: mod_id,
        mod_name: mod_name,
        mod_version: mod_version,
        minecraft_version: minecraft_version,
        neo_version: neo_version,
        geckolib_version: geckolib_version,
        network_protocol: '13',
        asset_license: "MIT (code and original assets); Roundabout License v1.2 (adapted models); GPL-3.0 for specified independent audio assets; collected playtest recordings retain their owners' rights",
        audio_description: 'Alpha with the previously collected anime recordings assigned to Stand attacks and time stop; see the audio credits and provenance.'
    ]
    inputs.properties properties
    expand properties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/modMetadata')
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar) {
    from('LICENSE')
    from('art/journey/asset-provenance.json') { into 'META-INF/jojosmod'; rename { 'journey-provenance.json' } }
    from('art/items/asset-provenance.json') { into 'META-INF/jojosmod'; rename { 'item-sprites-provenance.json' } }
    from('art/anime_audio/LICENSE-GPL-3.0.txt') { into 'META-INF/jojosmod/audio-licenses' }
    from('art/anime_audio/sources.json') { into 'META-INF/jojosmod'; rename { 'anime-audio-sources.json' } }
    from('art/anime_audio/provenance.json') { into 'META-INF/jojosmod'; rename { 'anime-audio-provenance.json' } }
    from('LICENSE-MDK.txt')
    from('THIRD_PARTY_NOTICES.md')
    from('art/star_platinum/upstream/LICENSE-Roundabout.txt')
    from('art/star_platinum/asset-provenance.json') {
        into 'META-INF/jojosmod'
        rename { 'star-platinum-provenance.json' }
    }
    from('art/sounds/original-provenance.json') {
        into 'META-INF/jojosmod'
        rename { 'sound-original.json' }
    }
    from('art/sounds/collected-preview-provenance.json') {
        into 'META-INF/jojosmod'
        rename { 'sound-collected-preview.json' }
    }
    from('art/hierophant_green/asset-provenance.json') {
        into 'META-INF/jojosmod'
        rename { 'hierophant-green-provenance.json' }
    }
    from('art/part_three/asset-provenance.json') { into 'META-INF/jojosmod'; rename { 'part-three-provenance.json' } }
    from('art/part_three/time-effects-provenance.json') { into 'META-INF/jojosmod'; rename { 'time-effects-provenance.json' } }
    from('art/part_three/sound-provenance.json') { into 'META-INF/jojosmod'; rename { 'sound-part-three.json' } }
    from('art/hierophant_green/sound-provenance.json') {
        into 'META-INF/jojosmod'
        rename { 'sound-hierophant-green.json' }
    }
}

// Compile the integration suite during a normal build; execute it with runGameTestServer.
tasks.named('check') {
    dependsOn tasks.named('gameTestClasses')
}

// Public packages use an explicit hash-checked allowlist of original audio. The
// normal development JAR and runClient keep the owner's existing audio playtest.
def releasePython = providers.gradleProperty('pythonExecutable').orElse('python3')
def publicAudioDirectory = layout.buildDirectory.dir('generated/publicAlphaAudio')
def generatePublicAlphaAudio = tasks.register('generatePublicAlphaAudio', Exec) {
    inputs.files(fileTree('art') { include '**/*provenance.json' })
    inputs.files(fileTree('src/main/resources/assets/jojosmod/sounds'))
    inputs.file('src/main/resources/assets/jojosmod/sounds.json')
    inputs.dir('src/main/resources/assets/jojosmod/lang')
    inputs.dir('tools/release')
    outputs.dir(publicAudioDirectory)
    commandLine releasePython.get(), 'tools/release/public_audio.py', '--output', publicAudioDirectory.get().asFile
}

def generatePublicAlphaMetadata = tasks.register('generatePublicAlphaMetadata', ProcessResources) {
    def properties = [
        mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
        minecraft_version: minecraft_version, neo_version: neo_version,
        geckolib_version: geckolib_version, network_protocol: '13',
        asset_license: 'MIT (code and original assets); Roundabout License v1.2 (adapted models and atlases)',
        audio_description: 'Public alpha with original synthesized effects. No collected anime recordings are included.'
    ]
    inputs.properties properties
    expand properties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/publicAlphaMetadata')
}

def publicAlphaJar = tasks.register('publicAlphaJar', Jar) {
    group = 'distribution'
    description = 'Build the public alpha with original audio and retained model credits.'
    dependsOn tasks.named('jar'), generatePublicAlphaAudio, generatePublicAlphaMetadata
    archiveClassifier = 'public-alpha'
    from({ zipTree(tasks.named('jar', Jar).get().archiveFile.get().asFile) }) {
        exclude 'META-INF/MANIFEST.MF', 'META-INF/neoforge.mods.toml', 'THIRD_PARTY_NOTICES.md'
        exclude 'assets/jojosmod/sounds/**', 'assets/jojosmod/sounds.json', 'assets/jojosmod/lang/**'
        exclude 'META-INF/jojosmod/anime-audio-*', 'META-INF/jojosmod/sound-collected-preview.json'
        exclude 'META-INF/jojosmod/audio-licenses/**'
    }
    from(publicAudioDirectory)
    from(generatePublicAlphaMetadata)
    from('distribution/PUBLIC_NOTICES.md') { rename { 'THIRD_PARTY_NOTICES.md' } }
    manifest.attributes('JoJosMod-Distribution': 'public-alpha', 'JoJosMod-Network-Protocol': '13')
}

def verifyPublicAlpha = tasks.register('verifyPublicAlpha', Exec) {
    group = 'verification'
    description = 'Check actual public JAR audio, credits, metadata, resources and class isolation.'
    dependsOn publicAlphaJar
    inputs.file(publicAlphaJar.flatMap { it.archiveFile })
    inputs.dir('tools/release')
    inputs.files('gradle.properties', 'src/main/java/io/github/bg7427941/jojosmod/network/ModNetworking.java')
    commandLine releasePython.get(), 'tools/release/verify_public_alpha.py', publicAlphaJar.get().archiveFile.get().asFile
}

def publicAlphaDist = tasks.register('publicAlphaDist', Zip) {
    group = 'distribution'
    description = 'Create the verified player download, install guide, credits and checksum.'
    dependsOn verifyPublicAlpha
    archiveBaseName = mod_id
    archiveClassifier = 'public-alpha'
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from(publicAlphaJar)
    from('distribution/INSTALL.md', 'distribution/KNOWN_ISSUES.md', 'distribution/RELEASE_NOTES.md')
    from('LICENSE', 'LICENSE-MDK.txt')
    from('distribution/PUBLIC_NOTICES.md') { rename { 'THIRD_PARTY_NOTICES.md' } }
    from('art/star_platinum/upstream/LICENSE-Roundabout.txt')
    from(layout.buildDirectory.dir('publicAlphaVerification'))
}

// Owner-selected alpha: preserve the existing attack recordings and their terms.
// The original-audio publicAlphaDist remains independently buildable.
def animeAlphaJar = tasks.register('animeAlphaJar', Jar) {
    group = 'distribution'
    description = 'Build the alpha with the existing anime attack recordings and credits.'
    dependsOn tasks.named('jar')
    archiveClassifier = 'anime-alpha'
    from({ zipTree(tasks.named('jar', Jar).get().archiveFile.get().asFile) }) {
        exclude 'META-INF/MANIFEST.MF'
    }
    manifest.attributes('JoJosMod-Distribution': 'anime-alpha', 'JoJosMod-Network-Protocol': '13')
}

def verifyAnimeAlpha = tasks.register('verifyAnimeAlpha', Exec) {
    group = 'verification'
    description = 'Check recorded audio hashes, mappings, credits and the actual anime-alpha JAR.'
    dependsOn animeAlphaJar
    inputs.file(animeAlphaJar.flatMap { it.archiveFile })
    inputs.dir('tools/release')
    inputs.dir('art/anime_audio')
    inputs.file('art/sounds/collected-preview-provenance.json')
    commandLine releasePython.get(), 'tools/release/verify_anime_alpha.py', animeAlphaJar.get().archiveFile.get().asFile
}

tasks.register('animeAlphaDist', Zip) {
    group = 'distribution'
    description = 'Create the owner-selected alpha download with anime audio and editable audio sources.'
    dependsOn verifyAnimeAlpha
    archiveBaseName = mod_id
    archiveClassifier = 'anime-alpha'
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from(animeAlphaJar)
    from('distribution/INSTALL.md', 'distribution/KNOWN_ISSUES.md', 'distribution/RELEASE_NOTES.md')
    from('LICENSE', 'LICENSE-MDK.txt', 'THIRD_PARTY_NOTICES.md')
    from('art/star_platinum/upstream/LICENSE-Roundabout.txt')
    from('art/anime_audio/LICENSE-GPL-3.0.txt')
    from('art/anime_audio') { into 'sources/art/anime_audio'; exclude '__pycache__/**' }
    from('art/sounds/collected-preview-provenance.json') { into 'sources/art/sounds' }
    from(['LICENSE', 'THIRD_PARTY_NOTICES.md']) { into 'sources' }
    from(layout.buildDirectory.dir('animeAlphaVerification'))
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
