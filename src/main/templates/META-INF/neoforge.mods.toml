[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
An original Minecraft Stand system inspired by JoJo's Bizarre Adventure.
Star Platinum playtest: Star Finger, precise strike, timed barrage, frontal guard, persistent basic and advanced willpower mastery, earned cooldown bonuses and progress HUD.
Stand leap, precise arrow interception and a Star Platinum model and anime atlas adapted from Roundabout by Hydraheads and contributors, with thirteen original animations, synthesized sound effects and eight manually added listening-preview clips; see THIRD_PARTY_NOTICES.md.
Hierophant Green joins the Part 3 arrow pool with Emerald Splash, nine real emerald projectiles, an original model, six animations, five synthesized effects and persistent mastery.
Five more Part 3 Stands join with distinct combat, credited models, original animations/audio and persistent learning. The World and advanced Star Platinum can stop local time.
Owner-specific Star Platinum voice channels include a Z-only ORA event. Network protocol 10.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="geckolib"
type="required"
versionRange="[${geckolib_version},6.0)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="[${minecraft_version}]"
ordering="NONE"
side="BOTH"

[[mixins]]
config="jojosmod.mixins.json"
